name: Deploy BFF

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "Clave SSH configurada"

      - name: Probar conexion y crear carpeta
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo 'Conexion SSH exitosa' && mkdir -p ~/cloudnative/ms-bff"

      - name: Copiar proyecto a EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            -r \
            Dockerfile \
            .dockerignore \
            pom.xml \
            src \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/cloudnative/ms-bff/"

      - name: Desplegar BFF
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          cd ~/cloudnative/ms-bff

          docker build -t ms-bff .

          docker rm -f ms-bff || true

          docker run -d \
            --name ms-bff \
            --restart unless-stopped \
            --network cloudnative-network \
            -p 8083:8083 \
            --env-file ~/cloudnative/bff.env \
            ms-bff

          docker image prune -f

          EOF